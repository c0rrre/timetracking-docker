name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  repository_dispatch:
    types: [ timetracking-updated ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Docker repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version and push tag
        id: tag
        uses: mathieudutour/github-tag-action@v6.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg GITHUB_TOKEN=${{ secrets.PRIVATE_REPO_TOKEN }} \
            -t ghcr.io/${{ github.repository_owner }}/timetracking-docker:latest \
            -t ghcr.io/${{ github.repository_owner }}/timetracking-docker:${{ steps.tag.outputs.new_tag }} .

      - name: Push image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/timetracking-docker:latest
          docker push ghcr.io/${{ github.repository_owner }}/timetracking-docker:${{ steps.tag.outputs.new_tag }}
